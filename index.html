        <h1>ScanPlay : photo de cours en jeu, anglais, permis belge</h1>
        <p lang="fr">
          Prends une photo de ton cours : ScanPlay en fait un parcours de jeux (flashcards, quiz, écoute, écriture, dictée).
          Dans Univers Pix, tu peux aussi suivre un parcours anglais prêt (A1 à C2) ou réviser la théorie du permis belge,
          sans scanner de fiche. Premier scan d’essai sans compte. Active JavaScript pour utiliser l’application.
          En savoir plus :
          <a href="https://scanplay.org/fr/apprendre-anglais/">apprendre l’anglais</a>
          et
          <a href="https://scanplay.org/fr/permis-theorique-belge/">permis théorique belge</a>.
        </p>
        <p lang="en">
          Photograph your notes: ScanPlay turns them into a revision game path (flashcards, quiz, listening, writing, dictation).
          In Pix Universe you can also follow a ready English course (A1 to C2) or revise Belgian driving theory, without scanning a sheet.
          First trial scan without an account. Enable JavaScript to use the app.
          Learn more:
          <a href="https://scanplay.org/fr/apprendre-anglais/">learn English</a>
          and
          <a href="https://scanplay.org/fr/permis-theorique-belge/">Belgian driving theory</a>.
        </p>
